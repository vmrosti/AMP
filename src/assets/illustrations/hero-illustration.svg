<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="gearGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7A1D"/>
      <stop offset="1" stop-color="#0A5A15"/>
    </linearGradient>
    <linearGradient id="gearGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D319"/>
      <stop offset="1" stop-color="#0E7A1D"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0C4112" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Technical coordinate grid -->
  <g opacity="0.12" stroke="#14161A" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
  </g>

  <!-- Large gear, back -->
  <g filter="url(#softShadow)" transform="translate(330,260)">
    <g id="gearBig" class="gear-spin gear-spin--slow">
      <circle r="110" fill="url(#gearGrad1)"/>
      <circle r="46" fill="#F5F4F1"/>
      <g fill="url(#gearGrad1)">
        <rect x="-14" y="-134" width="28" height="34" rx="4"/>
        <rect x="-14" y="100" width="28" height="34" rx="4"/>
        <rect x="-134" y="-14" width="34" height="28" rx="4"/>
        <rect x="100" y="-14" width="34" height="28" rx="4"/>
      </g>
      <g fill="url(#gearGrad1)" transform="rotate(45)">
        <rect x="-12" y="-128" width="24" height="30" rx="4"/>
        <rect x="-12" y="98" width="24" height="30" rx="4"/>
        <rect x="-128" y="-12" width="30" height="24" rx="4"/>
        <rect x="98" y="-12" width="30" height="24" rx="4"/>
      </g>
    </g>
  </g>

  <!-- Small gear, front, meshing -->
  <g filter="url(#softShadow)" transform="translate(210,380)">
    <g class="gear-spin gear-spin--fast">
    <circle r="62" fill="url(#gearGrad2)"/>
    <circle r="26" fill="#F5F4F1"/>
    <g fill="url(#gearGrad2)">
      <rect x="-9" y="-78" width="18" height="22" rx="3"/>
      <rect x="-9" y="56" width="18" height="22" rx="3"/>
      <rect x="-78" y="-9" width="22" height="18" rx="3"/>
      <rect x="56" y="-9" width="22" height="18" rx="3"/>
    </g>
    <g fill="url(#gearGrad2)" transform="rotate(45)">
      <rect x="-8" y="-74" width="16" height="20" rx="3"/>
      <rect x="-8" y="54" width="16" height="20" rx="3"/>
      <rect x="-74" y="-8" width="20" height="16" rx="3"/>
      <rect x="54" y="-8" width="20" height="16" rx="3"/>
    </g>
    </g>
  </g>

  <!-- Circuit / toolpath traces -->
  <g stroke="#0C4112" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M40 120 L140 120 L180 80"/>
    <path d="M560 200 L470 200 L430 240"/>
    <path d="M60 480 L150 480 L190 440"/>
  </g>
  <circle cx="40" cy="120" r="5" fill="#0C4112" opacity="0.6"/>
  <circle cx="560" cy="200" r="5" fill="#0C4112" opacity="0.6"/>
  <circle cx="60" cy="480" r="5" fill="#0C4112" opacity="0.6"/>

  <!-- Precision crosshair accents -->
  <g stroke="#0E7A1D" stroke-width="1.5" opacity="0.7">
    <circle cx="500" cy="450" r="18" fill="none"/>
    <line x1="500" y1="425" x2="500" y2="440"/>
    <line x1="500" y1="460" x2="500" y2="475"/>
    <line x1="475" y1="450" x2="490" y2="450"/>
    <line x1="510" y1="450" x2="525" y2="450"/>
  </g>
</svg>
